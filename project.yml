name: AIOStreams
options:
  bundleIdPrefix: io.github.aiostreams-ios
  deploymentTarget:
    iOS: "18.0"
    tvOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Only for a build run from Xcode: scripts/make-ipa.sh sets both from the release tags.
    MARKETING_VERSION: "0.2.7"
    CURRENT_PROJECT_VERSION: "1"
packages:
  # AetherEngine 7.67.0 with TrueHD Atmos and DTS:X heights and Dolby Vision FEL turned on.
  AetherEngineFeatures:
    path: Packages/AetherEngineFeatures
targets:
  AIOStreams:
    type: application
    platform: iOS
    sources:
      - path: AIOStreams/Sources
      - path: AIOStreams/Assets.xcassets
      # The web app's standalone build, copied in by scripts/build-web.sh, kept as a folder.
      - path: AIOStreams/Resources/web
        type: folder
        buildPhase: resources
    dependencies:
      - package: AetherEngineFeatures
        product: AetherEngineFeatures
    info:
      path: AIOStreams/Info.plist
      properties:
        CFBundleDisplayName: AIOStreams
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Resizable: Split View and Slide Over on iPad, and iPhone Duo's folding and Split View, where
        # an app that asks for the full screen is held in a fixed window.
        UIViewControllerBasedStatusBarAppearance: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Dark
        # Playback keeps going with the screen off or the app in the background.
        UIBackgroundModes:
          - audio
        # Self-hosted servers are often plain http on the local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: AIOStreams connects to your server and streams on your local network.
        NSMicrophoneUsageDescription: Voice search in the page's search field uses the microphone.
        CFBundleURLTypes:
          - CFBundleURLName: io.github.aiostreams-ios.link
            CFBundleURLSchemes:
              - aiostreams
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.aiostreams-ios.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  AIOStreamsTV:
    type: application
    platform: tvOS
    sources:
      - path: TV/Sources
      - path: TV/Assets.xcassets
      # Inter, the web app's typeface (SIL Open Font License, TV/Fonts/OFL.txt).
      - path: TV/Fonts
        buildPhase: resources
      # Shared with the iOS app.
      - path: AIOStreams/Sources/Support.swift
      - path: AIOStreams/Sources/SubtitleOverlayView.swift
      - path: AIOStreams/Sources/YouTube.swift
    dependencies:
      - package: AetherEngineFeatures
        product: AetherEngineFeatures
    info:
      path: TV/Info.plist
      properties:
        CFBundleDisplayName: AIOStreams
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UIUserInterfaceStyle: Dark
        UIBackgroundModes:
          - audio
        # Self-hosted servers are often plain http on the local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: AIOStreams connects to your server and streams on your local network.
        UIAppFonts:
          - Inter-Regular.ttf
          - Inter-Medium.ttf
          - Inter-SemiBold.ttf
          - Inter-Bold.ttf
          - Inter-ExtraBold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.aiostreams-ios.tv
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        CODE_SIGN_STYLE: Automatic
