name: Build IPA

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      aiostreams_ref:
        description: AIOStreams commit, tag or branch for the web app (blank for web/AIOSTREAMS_REF)
        required: false
        default: ""
      height_channels:
        description: Build with TrueHD Atmos and DTS:X height channels (may need patent licences; not for public releases)
        type: boolean
        default: false
      runner:
        description: Runner image (xcode-27 has Xcode 27.1, for iPhone Duo's full inner display)
        type: choice
        options:
          - xcode-27
          - macos-26
        default: xcode-27

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Xcode 27.1 builds against the iOS 27.1 SDK, which iPhone Duo's inner display needs to be used whole.
    runs-on: ${{ inputs.runner || 'xcode-27' }}
    timeout-minutes: 60
    env:
      AIOSTREAMS_REF: ${{ inputs.aiostreams_ref }}
      # Only a manual run can turn them on; pushes, tags and releases build without them.
      HEIGHT_CHANNELS: ${{ inputs.height_channels && 'on' || 'off' }}
      # A tag build is the version its tag names, even where another tag shares the commit.
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
    steps:
      # The whole history and its tags: the version comes from the v* tags, the build number from
      # the commit count (scripts/make-ipa.sh).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # AetherEngine supports Xcode 27; 26.3 is its best-effort floor. Take the newest released one on
      # the runner, a beta only where there's nothing else.
      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          xcode=$(ls -d /Applications/Xcode_2[6-9]*.app | grep -vi beta | sort -V | tail -n 1)
          [ -n "$xcode" ] || xcode=$(ls -d /Applications/Xcode_2[6-9]*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Build the web app
        run: |
          [ -n "$AIOSTREAMS_REF" ] || unset AIOSTREAMS_REF
          scripts/build-web.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build the iOS IPA
        run: scripts/make-ipa.sh ios

      - name: Build the tvOS IPA
        run: scripts/make-ipa.sh tvos

      - uses: actions/upload-artifact@v4
        with:
          name: AIOStreams-ipa
          path: build/AIOStreams.ipa
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: AIOStreams-tvOS-ipa
          path: build/AIOStreams-tvOS.ipa
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release's IPAs must carry its version.
          built=$(cat build/version.txt)
          if [ "$built" != "${GITHUB_REF_NAME#v}" ]; then
            echo "built $built for $GITHUB_REF_NAME" >&2
            exit 1
          fi
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Unsigned IPAs. Sign them when you install them."
          gh release upload "$GITHUB_REF_NAME" build/AIOStreams.ipa build/AIOStreams-tvOS.ipa --clobber
          # The AltStore / SideStore source, every release's IPA in it, on each release so
          # releases/latest/download/altstore.json is always the newest.
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate > build/releases.json
          python3 scripts/altstore-source.py build/releases.json "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" \
            build/AIOStreams.ipa build/altstore.json
          gh release upload "$GITHUB_REF_NAME" build/altstore.json --clobber
